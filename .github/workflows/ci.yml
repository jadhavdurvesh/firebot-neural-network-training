name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Physics + brain + safety tests
        run: python -m pytest -q tests
      - name: 30-second smoke run of the daily pipeline
        run: python scripts/daily_train.py --state-dir /tmp/state --minutes 0.5 --n-envs 1 --eval-episodes 2
